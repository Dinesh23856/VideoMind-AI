# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo

services:
  # ── Web API (FastAPI + UI) ──────────────────────────────────────────
  - type: web
    name: vtk-api
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONPATH
        value: /app
      - key: SCRATCH_DIR
        value: /tmp/media_proc
      - key: REDIS_URL
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_PARENT_PAGE_ID
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: ASR_PROVIDER
        value: groq
      - key: WHISPER_DEVICE
        value: cpu
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]'

  # ── Celery Worker ───────────────────────────────────────────────────
  - type: worker
    name: vtk-worker
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A app.orchestration.celery_app.celery_app worker --loglevel=info --concurrency=1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONPATH
        value: /app
      - key: SCRATCH_DIR
        value: /tmp/media_proc
      - key: REDIS_URL
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: vtk-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_PARENT_PAGE_ID
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o
      - key: ASR_PROVIDER
        value: groq
      - key: WHISPER_DEVICE
        value: cpu
      - key: SECRET_KEY
        generateValue: true

  # ── Redis ───────────────────────────────────────────────────────────
  - type: redis
    name: vtk-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
